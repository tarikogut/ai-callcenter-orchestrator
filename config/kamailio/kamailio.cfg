#!KAMAILIO
#
# Kamailio SBC & Multi-Tenant SIP Registrar for AI Call Center Platform
# Routing inbound carrier calls to FreeSWITCH and managing multi-tenant domains
# (e.g. 101@eczane_hayat, 201@jet_kargo)
#

####### Defined Values #########
#!define WITH_NAT
#!define WITH_AUTH
#!define WITH_RTPENGINE

#!substdef "!FS_ADDR!freeswitch:5080!ig"
#!substdef "!RTPENGINE_SOCK!udp:rtpengine:22222!ig"

####### Global Parameters #########
debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_name="kamailio"

children=4

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

tcp_connection_lifetime=3600
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384

alias="localhost"
alias="kamailio"
alias="eczane_hayat"
alias="jet_kargo"

####### Modules Section ########
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "rtpengine.so"
loadmodule "auth.so"
loadmodule "nathelper.so"

# ----------------- Module Configuration -----------------
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 3000)
modparam("tm", "fr_inv_timer", 40000)

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 1)

modparam("registrar", "min_expires", 60)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "default_expires", 300)

modparam("rtpengine", "rtpengine_sock", RTPENGINE_SOCK)

modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", 7)
modparam("nathelper", "sipping_from", "sip:keepalive@kamailio")

####### Routing Logic ########
request_route {
    # Per-request sanity checks
    route(REQINIT);

    # NAT detection
    route(NATDETECT);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Handle retransmissions
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # Handle in-dialog requests
    route(WITHINDLG);

    ### --- REGISTER Routing (Multi-tenant Registrar) --- ###
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    ### --- Initial INVITE & Call Routing --- ###
    if (is_method("INVITE")) {
        route(INVITE_ROUTE);
        exit;
    }

    # Generic relay for other SIP methods (OPTIONS, INFO, etc.)
    route(RELAY);
}

# Wrapper for relays
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Per-request sanity checks
route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check()) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }
}

# In-dialog SIP messages handling (ACK, BYE, PRACK, etc.)
route[WITHINDLG] {
    if (!has_totag()) return;

    if (loose_route()) {
        route(DLG_NAT);
        if (is_method("BYE")) {
            rtpengine_delete();
        }
        route(RELAY);
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    sl_send_reply("404", "Not here");
    exit;
}

# NAT handling for in-dialog requests
route[DLG_NAT] {
    if (check_route_param("nat=yes")) {
        setflag(6); # FLT_NATS
    }
    if (isflagset(6)) {
        fix_nated_contact();
    }
}

# Basic NAT detection
route[NATDETECT] {
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            fix_nated_contact();
        }
        setflag(6);
    }
}

# Multi-tenant Registrar handler (101@eczane_hayat, 201@jet_kargo)
route[REGISTRAR] {
    xlog("L_INFO", "[REGISTRAR] Registration request: user=$rU domain=$rd from=$fu to=$tu\n");

    # In production, check digest auth credentials or DB
    # Save location binding user and domain
    if (!save("location")) {
        sl_reply_error();
    }
    xlog("L_INFO", "[REGISTRAR] Registered $rU@$rd successfully\n");
    exit;
}

# Inbound & Outbound INVITE routing with RTPEngine & FreeSWITCH
route[INVITE_ROUTE] {
    record_route();

    # 1. Check if destination is registered in our local multi-tenant location table
    if (lookup("location")) {
        xlog("L_INFO", "[ROUTING] Direct call to registered user: $ru\n");
        # Engage RTPEngine for media proxying
        rtpengine_manage("replace-origin replace-session-connection");
        t_on_reply("REPLY_ROUTE");
        route(RELAY);
    }

    # 2. Inbound DID call from Carrier / Trunk -> Route to FreeSWITCH Media Server
    xlog("L_INFO", "[ROUTING] Inbound DID/Trunk call: $rU from $fu -> Forwarding to FreeSWITCH at FS_ADDR\n");

    # Multi-tenant DID tagging
    if ($rU =~ "^(08501110001|908501110001)$") {
        append_hf("X-Tenant-ID: eczane_hayat\r\n");
        append_hf("X-Workflow-ID: wf-eczane-main\r\n");
    } else if ($rU =~ "^(08502220002|908502220002)$") {
        append_hf("X-Tenant-ID: jet_kargo\r\n");
        append_hf("X-Workflow-ID: wf-kargo-main\r\n");
    } else {
        append_hf("X-Tenant-ID: default_tenant\r\n");
    }

    # RTPEngine for transcoding and NAT traversal
    rtpengine_manage("replace-origin replace-session-connection");

    # Set destination URI to FreeSWITCH
    $du = "sip:FS_ADDR";

    t_on_reply("REPLY_ROUTE");
    t_on_failure("FAIL_ROUTE");
    route(RELAY);
}

onreply_route[REPLY_ROUTE] {
    xlog("L_INFO", "[REPLY] Response status $rs from $si:$sp\n");
    if (status =~ "[12][0-9][0-9]") {
        rtpengine_manage("replace-origin replace-session-connection");
        if (isflagset(6)) {
            fix_nated_contact();
        }
    }
}

failure_route[FAIL_ROUTE] {
    if (t_is_canceled()) {
        rtpengine_delete();
        exit;
    }
    xlog("L_WARN", "[FAILURE] Call failed with status $T_reply_code to $ru\n");
    rtpengine_delete();
}
